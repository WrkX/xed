name: remote-server

# Builds only the remote development server (not the Zed app) and publishes it
# to a release tagged "remote-server-<commit>", where dev builds download it from.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to build (defaults to the dispatched ref)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "script/linux"
      - ".github/workflows/remote-server.yml"

permissions:
  contents: read

concurrency:
  group: remote-server
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: 0
      REMOTE_TARGET: ${{ matrix.target }}
      REMOTE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
          key: ${{ runner.os }}-${{ runner.arch }}-remote-server-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |-
            ${{ runner.os }}-${{ runner.arch }}-remote-server-
      - name: Install system dependencies
        run: ./script/linux
      - name: Add Rust target
        run: rustup target add "$REMOTE_TARGET"
      - name: Build remote server
        run: |-
          set -euo pipefail
          cc_var="CC_$(echo "$REMOTE_TARGET" | tr '-' '_')"
          export "$cc_var=musl-gcc"
          cargo --config .cargo/bundle-config.toml build --release \
            --package remote_server \
            --target "$REMOTE_TARGET"
      - name: Strip and compress
        run: |-
          set -euo pipefail
          binary="target/$REMOTE_TARGET/release/remote_server"
          llvm-objcopy --strip-debug --discard-all "$binary"
          gzip -9 -c "$binary" > "target/zed-remote-server-linux-$REMOTE_ARCH.gz"
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tag="remote-server-${sha}"
          asset="target/zed-remote-server-linux-$REMOTE_ARCH.gz"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Remote server ${sha:0:7}" \
              --notes "Prebuilt remote development server for ${sha}" || \
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete remote server releases older than 90 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          cutoff=$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,createdAt \
            --jq ".[] | select(.tagName | startswith(\"remote-server-\")) | select(.createdAt < \"$cutoff\") | .tagName" |
          while read -r old_tag; do
            [ -n "$old_tag" ] || continue
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
